<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#f5f5f5"/>
  
  <!-- Gold rectangle border -->
  <rect x="70" y="110" width="180" height="180" fill="none" stroke="#d4a574" stroke-width="8" rx="5"/>
  
  <!-- Letter B -->
  <text x="200" y="240" font-family="Georgia, serif" font-size="120" font-weight="bold" fill="#1a2a4a" text-anchor="middle" dominant-baseline="middle">B</text>
  
  <!-- Letter I -->
  <line x1="280" y1="130" x2="280" y2="270" stroke="#1a2a4a" stroke-width="8"/>
  <line x1="260" y1="130" x2="300" y2="130" stroke="#1a2a4a" stroke-width="8"/>
  <line x1="260" y1="270" x2="300" y2="270" stroke="#1a2a4a" stroke-width="8"/>
  
  <!-- Decorative accent line -->
  <line x1="250" y1="120" x2="250" y2="280" stroke="#d4a574" stroke-width="3" opacity="0.7"/>
</svg>